[package]
name = "addons-forever-core"
description = "Core library for the addons-forever WoW: Forever addon manager (providers, scanning, install, updates)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7"
encoding_rs = "0.8"
futures = "0.3"
notify = "8"
notify-debouncer-full = "0.7"
rust-ini = "0.21"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "gzip",
    "http2",
    "stream",
    "system-proxy",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate", "zstd"] }
md-5 = "0.10"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
